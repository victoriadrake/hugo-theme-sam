name: Deploy demo to Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true
      - uses: actions/configure-pages@v6.0.0
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check:html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
