name: test-versions
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: ['0.163.0', 'latest']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: ${{ matrix.hugo }}
          extended: true
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check:html
